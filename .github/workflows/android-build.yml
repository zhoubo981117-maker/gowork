name: Build Android APK

on:
  push:
    branches:
      - claude/android-app-fixes-TfLX9
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (generate native android project)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Gradle build (assembleRelease)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "Found APK: $APK"
          cp "$APK" gowork.apk
          echo "path=gowork.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gowork-android-apk
          path: gowork.apk
          if-no-files-found: error

      - name: Publish APK to a downloadable Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: go work Android APK (latest)
          body: |
            Latest installable Android APK built from `${{ github.ref_name }}` (commit ${{ github.sha }}).

            Download `gowork.apk` below, open it on your Android phone, and allow
            installation from unknown sources to install.
          files: gowork.apk
          make_latest: true
